<!-- Contenedor del encabezado, con una etiqueta estandar de HTML -->
<header>
  <!-- Imagen con enlace de la UNIR.
   Lleva una directiva como un atributo de etiqueta [appEnlaceSeguro] esto hace que se cree como un componente pero sin plantilla propia.
   Consultar directiva para más informacion -->
  <div class="izquierda">
    <a href="https://www.unir.net" appEnlaceSeguro target="_blank">
      <img class="encabezado-unir" src="logo-unir.png" alt="Logo empresa" />
    </a>
  </div>

  <!-- Boton oculto con el titulo del sitio web que emite un evento tipo click y hace que se muestre todos los tickets, independientemente de su categoría -->
  <div class="centro">
    <button (click)="cambiarTicketVisible()" class="principal">
      <!-- <img class="logo-app" src="logo-app.png" alt="Logo apliacion"> -->
      <h3>SERVICE ADMINISTRATOR - ( PORTAL TÉCNICO )</h3>
    </button>
  </div>

  <div class="user-wrapper">

    <button appButton class="usuario-button" (click)="mostrarRecuadro()">{{usuarioLogeado()?.username}}

      <span ngProjectAs="icono"
            ><img class="especificas" src="user-icon.png" alt="Imagen de usuario"
          /></span>
    </button>


    <div class="recuadro-usuario" [class.visible]="recuadro()">
      <div class="info-personal">
      <p>{{ usuarioLogeado()?.nombre | titlecase }} - Grupo {{usuarioLogeado()?.grupo?.nombreGrupo}}</p>

      <a href="">{{ usuarioLogeado()?.email }}</a>

      </div>

      <div class="contenedor-botones">
        <button appButton (click)="alCerrarSesion()">
          Cerrar sesión
          <span ngProjectAs="icono"
            ><img class="especificas2" src="logout2.png" alt="Imagen de resolver"
          /></span>
        </button>
        <button appButton (click)="mostrarRecuadro()">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</header>
