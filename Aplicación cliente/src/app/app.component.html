@if (!logeado()) {
  <app-panel-login />
} @else {
  @if (mostrarAdvertencia()) {
    <div class="contendor-inactividad">
      <div class="contendor-card">
        <h3>La sesión está a punto de expirar</h3>
        <p>
          Tu sesión se cerrará en <strong>{{ tiempoRestante() }}</strong> segundos por inactividad.
        </p>

        <div class="contenedor-botones">
          <button appButton (click)="extenderSesion()">Extender</button>
          <button appButton (click)="cerrarSesionPorInactividad()">Cerrar sesión</button>
        </div>
      </div>
    </div>
  }

  <!-- Mostramos el encabezado -->

  <app-encabezado (cerrarSesion)="cerrarSesion()" />

  <!-- Mostramos los botones para moverse por los distintos tipos de tickets. -->
  <div class="layout">
    <aside [class.sidebar]="asideDesplegado()" [class.sidebar-oculta]="!asideDesplegado()">
      <div class="derecha">
        @if (!asideDesplegado()) {
          <button (click)="desplegarAside()" class="aside">
            <span ngProjectAs="icono"
              ><img class="especificas espejo" src="manipularAside.png" alt="Imagen de >>"
            /></span>
          </button>
        } @else {
          <button (click)="plegarAside()" class="aside">
            <span ngProjectAs="icono"
              ><img class="especificas" src="manipularAside.png" alt="Imagen de <<"
            /></span>
          </button>
        }
      </div>

      @if (asideDesplegado()) {
        @for (funcion of funciones; track $index) {
          <app-funciones [funcion]="funcion" />
        }
      }
    </aside>

    <!-- Pantalla inicial con todos los tickets -->
    <main
      [class]="{ 'body-aplicacion': asideDesplegado(), 'body-aplicacion-full': !asideDesplegado() }"
    >
      <app-cuerpo />
    </main>
  </div>
}
